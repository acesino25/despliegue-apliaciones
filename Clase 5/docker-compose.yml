# Docker compose utilizado para desplegar en producción
services:
  api:
    # En el servidor, GitHub Actions escribe API_IMAGE (ghcr.io/...) en el archivo .env.
    # En local no existe, así que usa la imagen que creamos a mano con el Dockerfile.
    image: ${API_IMAGE:-api-node:v1}
    restart: always
    environment:
      - PORT=3000
      - PG_HOST=clase5_pg_db
      - PG_PORT=5432
      - PG_USER=el_admin
      - PG_PASSWORD=despliegue2026*
      - PG_DB=autos
    depends_on:
      - db
  db:                 # Definimos el servicio PG, que es una imagen de un repo de imágenes
    image: postgres:15-alpine
    container_name: clase5_pg_db
    restart: always
    environment:
      POSTGRES_USER: el_admin
      POSTGRES_PASSWORD: despliegue2026*
      POSTGRES_DB: autos
    volumes:
      - pg_data:/var/lib/postgresql/data
  nginx:
    image: nginx:alpine
    container_name: clase5_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./static:/usr/share/nginx/html:ro
    depends_on:
      - api
# Definimos volumenes
volumes:
  pg_data: # Dejamos vacío porque no vamos a configurar la redirección de almacenamiento a ningún otro lado, u otro valor personalizable.